name: Stage 1+2+3+4+5 Windows Verification

on:
  push:
    branches:
      - cursor/bootstrap-restore-fixes-beb8
      - cursor/stage-3-no-auto-boot-beb8
      - cursor/stage-4-coordinator-state-beb8
      - cursor/stage-5-gate-map-beb8
      - main
  pull_request:
    branches:
      - main
      - cursor/bootstrap-restore-fixes-beb8
      - cursor/stage-3-no-auto-boot-beb8
      - cursor/stage-4-coordinator-state-beb8
      - cursor/stage-5-gate-map-beb8

concurrency:
  group: stage-1-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  stage-1-windows-verification:
    name: Stage 1+2+3+4+5 Windows Verification
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      STAGE1_BUILD_ID: gha-${{ github.run_number }}-${{ github.run_attempt }}
      STAGE2_BUILD_ID: gha-${{ github.run_number }}-${{ github.run_attempt }}
      STAGE3_BUILD_ID: gha-${{ github.run_number }}-${{ github.run_attempt }}
      STAGE4_BUILD_ID: gha-${{ github.run_number }}-${{ github.run_attempt }}
      STAGE5_BUILD_ID: gha-${{ github.run_number }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source + overlay Stage 1 patches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:GITHUB_WORKSPACE 'src'
          $zip = Join-Path $env:GITHUB_WORKSPACE 'Hijama-Management-System-SOURCE-BUILD-2.0.1.zip'
          if (-not (Test-Path $zip)) { throw "Missing source ZIP: $zip" }
          if (Test-Path $src) { Remove-Item -LiteralPath $src -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $src | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $src -Force
          if (Test-Path 'app-source') {
            Copy-Item -Path 'app-source\*' -Destination $src -Recurse -Force
          }
          if (Test-Path 'stage-1-uat/stage-1-backup-restore-uat.cjs') {
            New-Item -ItemType Directory -Force -Path (Join-Path $src 'scripts/windows-uat') | Out-Null
            Copy-Item -Force 'stage-1-uat/stage-1-backup-restore-uat.cjs' (Join-Path $src 'scripts/windows-uat/stage-1-backup-restore-uat.cjs')
          }
          if (Test-Path 'stage-1-uat/Install-Stage1-UAT.ps1') {
            Copy-Item -Force 'stage-1-uat/Install-Stage1-UAT.ps1' (Join-Path $src 'scripts/windows-uat/Install-Stage1-UAT.ps1')
          }
          if (Test-Path 'stage-1-uat/stage-1-package-evidence.cjs') {
            New-Item -ItemType Directory -Force -Path (Join-Path $src 'scripts/ci') | Out-Null
            Copy-Item -Force 'stage-1-uat/stage-1-package-evidence.cjs' (Join-Path $src 'scripts/ci/stage-1-package-evidence.cjs')
          }
          if (Test-Path 'stage-2-uat') {
            Copy-Item -Path 'stage-2-uat\*' -Destination $src -Recurse -Force
          }
          if (Test-Path 'stage-3-uat') {
            Copy-Item -Path 'stage-3-uat\*' -Destination $src -Recurse -Force
          }
          if (Test-Path 'stage-4-uat') {
            Copy-Item -Path 'stage-4-uat\*' -Destination $src -Recurse -Force
          }
          if (Test-Path 'stage-5-uat') {
            Copy-Item -Path 'stage-5-uat\*' -Destination $src -Recurse -Force
          }
          if (-not (Test-Path (Join-Path $src 'package.json'))) { throw 'Extracted source missing package.json' }
          "SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append
          "STAGE1_SRC_ROOT=$src" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Record source manifest
        shell: pwsh
        working-directory: src
        run: |
          $manifest = [ordered]@{
            branch = (git -C $env:GITHUB_WORKSPACE rev-parse --abbrev-ref HEAD)
            commit = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD)
            gitStatusPorcelain = (git -C $env:GITHUB_WORKSPACE status --porcelain)
            node = (node -v)
            npm = (npm -v)
            windowsVersion = (Get-CimInstance Win32_OperatingSystem).Version
            buildId = $env:STAGE1_BUILD_ID
            zip = 'Hijama-Management-System-SOURCE-BUILD-2.0.1.zip'
          }
          New-Item -ItemType Directory -Force -Path docs/remediation/evidence/STAGE-1-WINDOWS-UAT/$env:STAGE1_BUILD_ID | Out-Null
          $manifest | ConvertTo-Json -Depth 4 | Set-Content docs/remediation/evidence/STAGE-1-WINDOWS-UAT/$env:STAGE1_BUILD_ID/SOURCE-MANIFEST.json -Encoding UTF8

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: npm ci
        working-directory: src
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci --ignore-scripts
          node -e "require('better-sqlite3'); console.log('better-sqlite3 OK')"

      - name: Lint
        working-directory: src
        run: npm run lint

      - name: Unit tests
        working-directory: src
        run: npm test

      - name: E2E tests
        working-directory: src
        run: npm run test:e2e

      - name: Stage 1 focused tests
        working-directory: src
        shell: pwsh
        run: |
          $tests = @(
            'tests/baseline/test-v2-5-10-cloud-discovery-restore.js',
            'tests/baseline/test-p0-c-restore-truth-and-boot-gate.js',
            'tests/baseline/test-current-restore-license-login.js',
            'tests/baseline/test-current-setup-restore-runtime.js',
            'tests/baseline/test-v2-5-8-auth-activation-ui.js'
          )
          foreach ($t in $tests) {
            Write-Host "=== $t ==="
            node $t
            if ($LASTEXITCODE -ne 0) { throw "$t failed" }
          }

      - name: Stage 1 backup/restore UAT (isolated IPC)
        working-directory: src
        shell: pwsh
        env:
          TDAWI_UAT_USER_DATA: ${{ runner.temp }}\uat-stage1-${{ env.STAGE1_BUILD_ID }}
        run: node scripts/windows-uat/stage-1-backup-restore-uat.cjs

      - name: Stage 2 READY pure UAT + evidence
        working-directory: src
        shell: pwsh
        env:
          STAGE2_BUILD_ID: ${{ env.STAGE2_BUILD_ID }}
        run: node scripts/windows-uat/stage-2-ready-pure-uat.cjs

      - name: Stage 2 focused test
        working-directory: src
        run: node tests/baseline/test-stage-2-ready-pure.js

      - name: Stage 3 no-auto-boot UAT + evidence
        working-directory: src
        shell: pwsh
        env:
          STAGE3_BUILD_ID: ${{ env.STAGE3_BUILD_ID }}
        run: node scripts/windows-uat/stage-3-no-auto-boot-uat.cjs

      - name: Stage 3 focused test
        working-directory: src
        run: node tests/baseline/test-stage-3-no-auto-boot.js

      - name: Stage 4 coordinator state UAT + evidence
        working-directory: src
        shell: pwsh
        env:
          STAGE4_BUILD_ID: ${{ env.STAGE4_BUILD_ID }}
        run: node scripts/windows-uat/stage-4-coordinator-state-uat.cjs

      - name: Stage 4 focused test
        working-directory: src
        run: node tests/baseline/test-stage-4-bootstrap-coordinator-state.js

      - name: Stage 5 bootstrap gate map UAT + evidence
        working-directory: src
        shell: pwsh
        env:
          STAGE5_BUILD_ID: ${{ env.STAGE5_BUILD_ID }}
        run: node scripts/windows-uat/stage-5-bootstrap-gate-map-uat.cjs

      - name: Stage 5 focused test
        working-directory: src
        run: node tests/baseline/test-stage-5-bootstrap-gate-map.js

      - name: Generate packaging inputs
        working-directory: src
        shell: pwsh
        run: |
          node scripts/generate-oauth-config.mjs
          node scripts/generate-license-registries.mjs
          node scripts/generate-brand-assets.mjs

      - name: Build Windows Setup EXE
        id: build
        working-directory: src
        shell: pwsh
        env:
          ELECTRON_BUILDER_DISABLE_CODE_SIGN_WARNING: 'true'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          STAGE1_BUILD_STARTED_AT: ${{ github.run_started_at }}
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          npm run build:win
          $sw.Stop()
          $setup = Get-ChildItem dist\HijamaManagement-Setup-*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $setup -or $setup.Length -lt 50MB) { throw "Invalid Setup EXE: $($setup.Length)" }
          $sha = (Get-FileHash -Algorithm SHA256 $setup.FullName).Hash.ToLowerInvariant()
          $commit = (git -C $env:GITHUB_WORKSPACE rev-parse HEAD).Trim()
          $json = [ordered]@{
            filename = $setup.Name
            absolutePath = $setup.FullName
            sizeBytes = $setup.Length
            sha256 = $sha
            buildDurationMs = [int]$sw.Elapsed.TotalMilliseconds
            sourceCommit = $commit
            at = (Get-Date).ToString('o')
          }
          $evidenceDir = "docs/remediation/evidence/STAGE-1-WINDOWS-UAT/$env:STAGE1_BUILD_ID"
          $json | ConvertTo-Json -Depth 4 | Set-Content (Join-Path $evidenceDir 'SETUP-EXE.json') -Encoding UTF8
          "$sha  $($setup.Name)" | Set-Content (Join-Path $evidenceDir 'SHA256SUMS.txt') -Encoding UTF8
          "SETUP_SHA256=$sha" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Installed EXE smoke (isolated userData)
        working-directory: src
        shell: pwsh
        run: |
          pwsh -File scripts/windows-uat/Install-Stage1-UAT.ps1 `
            -RepoRoot $PWD `
            -BuildId $env:STAGE1_BUILD_ID `
            -EvidenceDir (Join-Path $PWD "docs/remediation/evidence/STAGE-1-WINDOWS-UAT/$env:STAGE1_BUILD_ID")

      - name: Package Stage 5 source ZIP
        if: success()
        working-directory: src
        shell: pwsh
        env:
          STAGE5_BUILD_ID: ${{ env.STAGE5_BUILD_ID }}
          STAGE_NUMBER: '5'
          STAGE_ZIP_LABEL: GATE-MAP-PASS
        run: node scripts/ci/package-stage-source-zip.cjs

      - name: Package evidence artifact
        if: always()
        working-directory: src
        run: node scripts/ci/stage-1-package-evidence.cjs

      - name: Upload Setup EXE
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: setup-exe-${{ github.run_number }}-${{ github.sha }}
          path: src/dist/HijamaManagement-Setup-*.exe
          retention-days: 7
          if-no-files-found: error

      - name: Upload Stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-evidence-${{ github.sha }}-${{ github.run_number }}
          path: |
            src/ci-artifacts/stage1-evidence-*/
            src/docs/remediation/evidence/STAGE-2-READY-PURE/**/*
            src/docs/remediation/evidence/STAGE-3-NO-AUTO-BOOT/**/*
            src/docs/remediation/evidence/STAGE-4-COORDINATOR-STATE/**/*
            src/docs/remediation/evidence/STAGE-5-BOOTSTRAP-GATE-MAP/**/*
            src/Tadawi-Stage-5-GATE-MAP-PASS-*.zip
          retention-days: 14
          if-no-files-found: warn

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage1-test-reports-${{ github.run_number }}
          path: |
            src/docs/remediation/evidence/STAGE-1-WINDOWS-UAT/**/*
          retention-days: 14
          if-no-files-found: warn
